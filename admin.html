<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin Dashboard ♡ Littlemeow store</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --color-pink-soft: #fde8f2;
      --color-pink-main: #fbc6e3;
      --color-pink-text: #db599f;
      --border-pink: #f09ac7;
      
      --color-green-main: #abeb6a;
      --color-green-dark: #4b8015;
      --color-cream: #fdfaf5;
      
      --text-main: #45363c;
      --text-muted: #826e76;
      --danger: #ef4444;
      --shadow-cute: 0 8px 22px rgba(240, 154, 199, 0.2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Quicksand', 'Mitr', sans-serif; }
    body {
      background: radial-gradient(circle at top, #ffffff 0%, var(--color-cream) 55%, #faecf4 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px 80px;
      display: flex;
      justify-content: center;
    }
    .container { width: 100%; max-width: 480px; }
    
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px 18px;
      box-shadow: var(--shadow-cute);
      border: 2px solid var(--border-pink);
      margin-bottom: 16px;
    }
    .title { font-size: 16.5px; font-weight: 700; color: var(--color-pink-text); text-align: center; margin-bottom: 16px; }
    .field-group { margin-bottom: 14px; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text-main); margin-bottom: 6px; display: block; }
    
    .input-box, .textarea-box {
      width: 100%; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--border-pink);
      outline: none; font-size: 13.5px; background: #fffdfa; color: var(--text-main);
    }
    .input-box:focus, .textarea-box:focus { border-color: var(--color-pink-text); }
    .textarea-box { resize: vertical; min-height: 80px; line-height: 1.5; }

    .file-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 14px; background: var(--color-pink-soft); border: 1.5px dashed var(--color-pink-text);
      border-radius: 14px; color: var(--color-pink-text); font-size: 12.5px; font-weight: 700;
      cursor: pointer; width: 100%; margin-bottom: 6px;
    }

    .btn {
      width: 100%; padding: 13px; border-radius: 18px; border: none;
      font-size: 14.5px; font-weight: 700; cursor: pointer;
      background: linear-gradient(135deg, var(--color-pink-main), var(--color-pink-text));
      color: #fff; margin-top: 6px; box-shadow: 0 4px 14px rgba(224, 96, 167, 0.25);
    }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: #fff; color: var(--color-pink-text); border: 1.5px solid var(--border-pink); margin-top: 10px; box-shadow: none; }
    
    .btn-add {
      background: #f4faeb; color: #355f10; border: 1.5px dashed var(--color-green-dark);
      font-size: 13px; padding: 10px; border-radius: 14px; margin-top: 8px; width: 100%; cursor: pointer; font-weight: 700;
    }

    .item-card {
      background: var(--color-cream); border: 1.5px solid var(--border-pink); border-radius: 18px;
      padding: 14px; margin-bottom: 12px; position: relative;
    }
    .item-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .del-btn {
      background: #fee2e2; color: var(--danger); border: 1px solid var(--danger);
      padding: 4px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 700; cursor: pointer;
    }

    .status-msg {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--text-main); color: #fff; padding: 10px 20px; border-radius: 20px;
      font-size: 13px; z-index: 999999; display: none; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card" id="loginBox">
    <div class="title">เข้าสู่ระบบแอดมิน ♡ Littlemeow store</div>
    <div class="field-group">
      <label class="field-label">email</label>
      <input type="email" id="loginEmail" class="input-box" placeholder="email">
    </div>
    <div class="field-group">
      <label class="field-label">password</label>
      <input type="password" id="loginPassword" class="input-box" placeholder="password">
    </div>
    <button type="button" class="btn" onclick="handleLogin()">เข้าสู่ระบบ</button>
  </div>

  <div id="dashboardBox" class="hidden">
    
    <!-- 1. ส่วนหัวร้านค้า -->
    <div class="card">
      <div class="title">1. ข้อมูลส่วนหัว & รายละเอียด</div>
      <div class="field-group">
        <label class="field-label">ชื่อร้าน</label>
        <input type="text" id="storeName" class="input-box" placeholder="Littlemeow store ♡">
      </div>
      <div class="field-group">
        <label class="field-label">คำอธิบาย Detail / Bio</label>
        <textarea id="storeBio" class="textarea-box" placeholder="ข้อความแนะนำร้าน..."></textarea>
      </div>

      <div class="field-group">
        <label class="field-label">รูปภาพปก / แบนเนอร์</label>
        <label class="file-btn">เลือกรูปแบนเนอร์จากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirect(event, 'bannerImg')"></label>
        <input type="text" id="bannerImg" class="input-box" placeholder="หรือวางลิงก์รูปแบนเนอร์">
      </div>

      <div class="field-group">
        <label class="field-label">รูปโปรไฟล์วงกลม</label>
        <label class="file-btn">เลือกรูปโปรไฟล์จากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDirect(event, 'profileImg')"></label>
        <input type="text" id="profileImg" class="input-box" placeholder="หรือวางลิงก์รูปโปรไฟล์">
      </div>
    </div>

    <!-- 2. รูปคู่ 2 ช่อง -->
    <div class="card">
      <div class="title">2. จัดการรูปคู่ 2 ช่อง (เพิ่ม/ลบได้ไม่จำกัด)</div>
      <div id="duoManager"></div>
      <button type="button" class="btn-add" onclick="addNewDuoCard()">+ เพิ่มรูปใหม่</button>
    </div>

    <!-- 3. 6 กรอบเล็ก -->
    <div class="card">
      <div class="title">3. จัดการกรอบเล็กในกรอบใหญ่ (6 กรอบ)</div>
      <div id="boxesManager"></div>
      <button type="button" class="btn-add" onclick="addNewBox()">+ เพิ่มกรอบเล็กใหม่</button>
    </div>

    <!-- 4. ส่วนจัดการ 5 กรอบใหญ่สไลเดอร์ผลงาน -->
    <div id="adminAllSlidersContainer"></div>

    <!-- 5. เพลงประกอบร้าน -->
    <div class="card">
      <div class="title">5. เพลงประกอบร้าน (.mp3)</div>
      <div class="field-group">
        <label class="field-label">URL เพลง</label>
        <input type="text" id="musicUrl" class="input-box">
      </div>
    </div>

    <!-- 6. บัญชีแอดมิน -->
    <div class="card">
      <div class="title">6. บัญชีและความปลอดภัยแอดมิน</div>
      <div class="field-group">
        <label class="field-label">อีเมลแอดมิน</label>
        <input type="email" id="adminEmailInput" class="input-box">
      </div>
      <div class="field-group">
        <label class="field-label">รหัสผ่านใหม่</label>
        <input type="password" id="newAdminPassword" class="input-box" placeholder="ปล่อยว่างหากไม่ต้องการเปลี่ยน">
      </div>
    </div>

    <button type="button" class="btn" id="saveBtn" onclick="saveAllConfig()">☁️ บันทึกขึ้นระบบทันที</button>
    <button type="button" class="btn btn-secondary" onclick="logout()">ออกจากระบบ</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCpAGDSy1NRgmLV_g7qJrCpwOhU9MrfQyY",
    authDomain: "benefitie.firebaseapp.com",
    projectId: "benefitie",
    storageBucket: "benefitie.firebasestorage.app",
    messagingSenderId: "270365672215",
    appId: "1:270365672215:web:230d1491091e26ce83ed52"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const DB_CONFIG = "littlemeow_site_config";
  const DB_DUO = "littlemeow_banner_cards";
  const DB_BOXES = "littlemeow_contact_boxes";

  let currentAdminEmail = "Fuwariyumeneko@gmail.com";
  let currentAdminPass = "pattrapa1234";

  let duoCardsData = [];
  let smallBoxesData = [];
  
  // จัดการข้อมูลสไลเดอร์ 5 กรอบใหญ่
  const TOTAL_SECTIONS = 5;
  let sliderHeadings = Array(TOTAL_SECTIONS).fill("");
  let sliderSectionsData = Array(TOTAL_SECTIONS).fill().map(() => []);

  db.collection(DB_CONFIG).doc("main").get().then(doc => {
    if (doc.exists) {
      const d = doc.data();
      if (d.adminEmail) currentAdminEmail = d.adminEmail;
      if (d.adminPass) currentAdminPass = d.adminPass;
    }
  });

  function showStatus(text, isError = false) {
    const el = document.getElementById("statusMsg");
    el.textContent = text;
    el.style.background = isError ? "#ef4444" : "#f09ac7";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3000);
  }

  function handleLogin() {
    const e = document.getElementById("loginEmail").value.trim();
    const p = document.getElementById("loginPassword").value.trim();
    if (e === currentAdminEmail && p === currentAdminPass) {
      document.getElementById("loginBox").classList.add("hidden");
      document.getElementById("dashboardBox").classList.remove("hidden");
      loadData();
    } else {
      alert("email หรือ password ไม่ถูกต้องค่ะ");
    }
  }

  function compressHDImage(file, maxDimension = 1080, quality = 0.9) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let width = img.width;
          let height = img.height;
          if (width > maxDimension || height > maxDimension) {
            if (width > height) {
              height = Math.round((height * maxDimension) / width);
              width = maxDimension;
            } else {
              width = Math.round((width * maxDimension) / height);
              height = maxDimension;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadDirect(event, inputId) {
    const file = event.target.files[0];
    if (!file) return;
    showStatus("กำลังแปลงไฟล์รูปภาพความละเอียดสูง...");
    try {
      const base64 = await compressHDImage(file, 1080, 0.9);
      document.getElementById(inputId).value = base64;
      showStatus("เลือกรูปสำเร็จ (ภาพชัด 100%)");
    } catch (err) {
      showStatus("แปลงรูปไม่สำเร็จ", true);
    }
  }

  async function loadData() {
    showStatus("กำลังโหลดข้อมูล...");
    try {
      const doc = await db.collection(DB_CONFIG).doc("main").get();
      const d = doc.exists ? doc.data() : {};
      
      document.getElementById("storeName").value = d.storeName || "Littlemeow store ♡";
      document.getElementById("storeBio").value = d.bio || "";
      document.getElementById("bannerImg").value = d.bannerImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261025_142526.jpeg";
      document.getElementById("profileImg").value = d.profileImg || "https://file.garden/asG8Gt-rqWIpi3II/line_oa_chat_261025_142322.jpeg";
      document.getElementById("musicUrl").value = d.musicUrl || "https://file.garden/asG8Gt-rqWIpi3II/Ariana%20Grande%20-%20God%20is%20a%20woman%20(Official%20Video).mp3";
      document.getElementById("adminEmailInput").value = currentAdminEmail;

      // 2. ดึงรูปคู่
      const duoSnap = await db.collection(DB_DUO).orderBy("order", "asc").get();
      duoCardsData = [];
      duoSnap.forEach(s => duoCardsData.push({ id: s.id, ...s.data() }));
      if (!duoCardsData.length) {
        duoCardsData = [{ image: "" }, { image: "" }];
      }
      renderDuoManager();

      // 3. ดึง 6 กรอบเล็ก
      const boxSnap = await db.collection(DB_BOXES).orderBy("order", "asc").get();
      smallBoxesData = [];
      boxSnap.forEach(s => smallBoxesData.push({ id: s.id, ...s.data() }));
      if (!smallBoxesData.length) {
        smallBoxesData = Array(6).fill().map((_, i) => ({ title: `รายการที่ ${i+1}`, url: "", icon: "" }));
      }
      renderBoxesManager();

      // 4. ดึงข้อมูลสไลเดอร์ทั้ง 5 กรอบใหญ่
      for (let sIdx = 0; sIdx < TOTAL_SECTIONS; sIdx++) {
        // ดึงหัวข้อ
        const metaDoc = await db.collection(DB_CONFIG).doc(`slider_meta_${sIdx}`).get();
        if (metaDoc.exists && metaDoc.data().heading) {
          sliderHeadings[sIdx] = metaDoc.data().heading;
        } else {
          sliderHeadings[sIdx] = sIdx === 0 ? "รวมกลุ่มของตกแต่ง" : `รวมกลุ่มของตกแต่ง ${sIdx + 1}`;
        }

        // ดึงภาพสไลด์
        const sSnap = await db.collection(`littlemeow_slider_section_${sIdx}`).orderBy("order", "asc").get();
        sliderSectionsData[sIdx] = [];
        sSnap.forEach(s => sliderSectionsData[sIdx].push({ id: s.id, ...s.data() }));
        if (!sliderSectionsData[sIdx].length && sIdx === 0) {
          sliderSectionsData[sIdx] = [{ image: "", desc: "", btnText: "ex", link: "" }];
        }
      }
      renderAllSlidersAdmin();

      showStatus("โหลดข้อมูลสำเร็จ");
    } catch (err) {
      showStatus("ดึงข้อมูลไม่สำเร็จ: " + err.message, true);
    }
  }

  function renderDuoManager() {
    const box = document.getElementById("duoManager");
    box.innerHTML = "";
    duoCardsData.forEach((item, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "item-card";
      wrap.innerHTML = `
        <div class="item-header">
          <span style="font-weight:700; color:var(--color-pink-text);">รูปที่ ${idx+1}</span>
          <button type="button" class="del-btn" onclick="removeDuoCard(${idx})">ลบรูปนี้ ✕</button>
        </div>
        <label class="file-btn">เลือกรูปจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadDuoImage(event, ${idx})"></label>
        <input type="text" class="input-box" id="duo-img-${idx}" value="${item.image || ''}" placeholder="หรือวางลิงก์รูปภาพ" oninput="duoCardsData[${idx}].image = this.value">
      `;
      box.appendChild(wrap);
    });
  }
  function addNewDuoCard() { duoCardsData.push({ image: "" }); renderDuoManager(); }
  function removeDuoCard(idx) { duoCardsData.splice(idx, 1); renderDuoManager(); }
  async function uploadDuoImage(event, idx) {
    const file = event.target.files[0];
    if (!file) return;
    const base64 = await compressHDImage(file, 1080, 0.9);
    duoCardsData[idx].image = base64;
    document.getElementById(`duo-img-${idx}`).value = base64;
    showStatus("ใส่รูปสำเร็จ");
  }

  function renderBoxesManager() {
    const box = document.getElementById("boxesManager");
    box.innerHTML = "";
    smallBoxesData.forEach((item, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "item-card";
      wrap.innerHTML = `
        <div class="item-header">
          <span style="font-weight:700; color:var(--color-pink-text);">กรอบเล็กที่ ${idx+1}</span>
          <button type="button" class="del-btn" onclick="removeBoxItem(${idx})">ลบกรอบนี้ ✕</button>
        </div>
        <div class="field-group">
          <label class="field-label">ข้อความ</label>
          <input type="text" class="input-box" value="${item.title || ''}" placeholder="ข้อความที่แสดง" oninput="smallBoxesData[${idx}].title = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์ URL ปลายทาง</label>
          <input type="text" class="input-box" value="${item.url || ''}" placeholder="https://..." oninput="smallBoxesData[${idx}].url = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">รูปภาพ/ไอคอนเล็กด้านซ้าย</label>
          <label class="file-btn">เลือกไอคอนจากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadBoxIcon(event, ${idx})"></label>
          <input type="text" class="input-box" id="box-icon-${idx}" value="${item.icon || ''}" placeholder="หรือวางลิงก์รูปไอคอน" oninput="smallBoxesData[${idx}].icon = this.value">
        </div>
      `;
      box.appendChild(wrap);
    });
  }
  function addNewBox() { smallBoxesData.push({ title: "รายการใหม่", url: "", icon: "" }); renderBoxesManager(); }
  function removeBoxItem(idx) { smallBoxesData.splice(idx, 1); renderBoxesManager(); }
  async function uploadBoxIcon(event, idx) {
    const file = event.target.files[0];
    if (!file) return;
    const base64 = await compressHDImage(file, 200, 0.9);
    smallBoxesData[idx].icon = base64;
    document.getElementById(`box-icon-${idx}`).value = base64;
    showStatus("ใส่ไอคอนสำเร็จ");
  }

  // สร้างหมวดจัดการ 5 กรอบใหญ่สไลเดอร์ผลงาน
  function renderAllSlidersAdmin() {
    const mainBox = document.getElementById("adminAllSlidersContainer");
    mainBox.innerHTML = "";

    for (let sIdx = 0; sIdx < TOTAL_SECTIONS; sIdx++) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="title">4.${sIdx + 1} จัดการสไลเดอร์กรอบที่ ${sIdx + 1}</div>
        <div class="field-group">
          <label class="field-label">หัวข้อสไลเดอร์กรอบนี้</label>
          <input type="text" class="input-box" id="sliderHeading_${sIdx}" value="${sliderHeadings[sIdx]}" oninput="sliderHeadings[${sIdx}] = this.value" placeholder="รวมกลุ่มของตกแต่ง ${sIdx + 1}">
        </div>
        <div id="sliderItemsList_${sIdx}"></div>
        <button type="button" class="btn-add" onclick="addNewSliderItem(${sIdx})">+ เพิ่มภาพสไลด์ในกรอบที่ ${sIdx + 1}</button>
      `;
      mainBox.appendChild(card);
      renderSliderItemsList(sIdx);
    }
  }

  function renderSliderItemsList(sIdx) {
    const box = document.getElementById(`sliderItemsList_${sIdx}`);
    box.innerHTML = "";
    sliderSectionsData[sIdx].forEach((item, idx) => {
      const wrap = document.createElement("div");
      wrap.className = "item-card";
      wrap.innerHTML = `
        <div class="item-header">
          <span style="font-weight:700; color:var(--color-pink-text);">ภาพสไลด์ที่ ${idx + 1}</span>
          <button type="button" class="del-btn" onclick="removeSliderItem(${sIdx}, ${idx})">ลบภาพนี้ ✕</button>
        </div>
        <div class="field-group">
          <label class="field-label">รูปภาพสไลด์</label>
          <label class="file-btn">เลือกรูปสไลด์จากเครื่อง <input type="file" accept="image/*" style="display:none;" onchange="uploadSliderImage(event, ${sIdx}, ${idx})"></label>
          <input type="text" class="input-box" id="slide-img-${sIdx}-${idx}" value="${item.image || ''}" placeholder="หรือวางลิงก์รูป" oninput="sliderSectionsData[${sIdx}][${idx}].image = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">คำอธิบายใต้รูป</label>
          <input type="text" class="input-box" value="${item.desc || ''}" placeholder="พิมพ์คำอธิบายใต้รูปภาพ..." oninput="sliderSectionsData[${sIdx}][${idx}].desc = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">ข้อความบนปุ่ม</label>
          <input type="text" class="input-box" value="${item.btnText || 'ex'}" placeholder="ex" oninput="sliderSectionsData[${sIdx}][${idx}].btnText = this.value">
        </div>
        <div class="field-group">
          <label class="field-label">ลิงก์เมื่อกดปุ่ม (ถ้ามี)</label>
          <input type="text" class="input-box" value="${item.link || ''}" placeholder="https://..." oninput="sliderSectionsData[${sIdx}][${idx}].link = this.value">
        </div>
      `;
      box.appendChild(wrap);
    });
  }

  function addNewSliderItem(sIdx) {
    sliderSectionsData[sIdx].push({ image: "", desc: "", btnText: "ex", link: "" });
    renderSliderItemsList(sIdx);
  }

  function removeSliderItem(sIdx, idx) {
    sliderSectionsData[sIdx].splice(idx, 1);
    renderSliderItemsList(sIdx);
  }

  async function uploadSliderImage(event, sIdx, idx) {
    const file = event.target.files[0];
    if (!file) return;
    const base64 = await compressHDImage(file, 1080, 0.9);
    sliderSectionsData[sIdx][idx].image = base64;
    document.getElementById(`slide-img-${sIdx}-${idx}`).value = base64;
    showStatus("ใส่รูปสไลด์สำเร็จ");
  }

  async function saveAllConfig() {
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "กำลังบันทึกข้อมูล...";
    showStatus("กำลังอัปเดตข้อมูลขึ้นระบบ...");

    const emailVal = document.getElementById("adminEmailInput").value.trim();
    if (emailVal) currentAdminEmail = emailVal;

    const payload = {
      storeName: document.getElementById("storeName").value.trim(),
      bio: document.getElementById("storeBio").value.trim(),
      bannerImg: document.getElementById("bannerImg").value.trim(),
      profileImg: document.getElementById("profileImg").value.trim(),
      musicUrl: document.getElementById("musicUrl").value.trim(),
      adminEmail: currentAdminEmail,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    const newPass = document.getElementById("newAdminPassword").value.trim();
    if (newPass) {
      payload.adminPass = newPass;
      currentAdminPass = newPass;
    }

    try {
      await db.collection(DB_CONFIG).doc("main").set(payload, { merge: true });

      // 1. บันทึกรูปคู่ 2 ช่อง
      const duoBatch = db.batch();
      const duoExisting = await db.collection(DB_DUO).get();
      duoExisting.forEach(d => duoBatch.delete(d.ref));
      await duoBatch.commit();
      for (let i = 0; i < duoCardsData.length; i++) {
        if (duoCardsData[i].image) {
          await db.collection(DB_DUO).add({ order: i, image: duoCardsData[i].image });
        }
      }

      // 2. บันทึก 6 กรอบเล็ก
      const boxBatch = db.batch();
      const boxExisting = await db.collection(DB_BOXES).get();
      boxExisting.forEach(d => boxBatch.delete(d.ref));
      await boxBatch.commit();
      for (let i = 0; i < smallBoxesData.length; i++) {
        await db.collection(DB_BOXES).add({
          order: i,
          title: smallBoxesData[i].title || "",
          url: smallBoxesData[i].url || "",
          icon: smallBoxesData[i].icon || ""
        });
      }

      // 3. บันทึกสไลเดอร์ทั้ง 5 กรอบใหญ่
      for (let sIdx = 0; sIdx < TOTAL_SECTIONS; sIdx++) {
        // บันทึกหัวข้อ
        await db.collection(DB_CONFIG).doc(`slider_meta_${sIdx}`).set({
          heading: sliderHeadings[sIdx] || `รวมกลุ่มของตกแต่ง ${sIdx + 1}`
        }, { merge: true });

        // บันทึกรายการสไลด์
        const sColl = `littlemeow_slider_section_${sIdx}`;
        const sBatch = db.batch();
        const existingDocs = await db.collection(sColl).get();
        existingDocs.forEach(d => sBatch.delete(d.ref));
        await sBatch.commit();

        for (let i = 0; i < sliderSectionsData[sIdx].length; i++) {
          const item = sliderSectionsData[sIdx][i];
          if (item.image) {
            await db.collection(sColl).add({
              order: i,
              image: item.image,
              desc: item.desc || "",
              btnText: item.btnText || "ex",
              link: item.link || ""
            });
          }
        }
      }

      showStatus("บันทึกข้อมูลทั้งหมดสำเร็จแล้ว");
      alert("✨ บันทึกข้อมูลสำเร็จเรียบร้อยแล้วค่ะ! กรอบใหญ่ทั้ง 5 อันอัปเดตทันที ♡");
      document.getElementById("newAdminPassword").value = "";
    } catch (err) {
      showStatus("บันทึกไม่สำเร็จ: " + err.message, true);
      alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "☁️ บันทึกขึ้นระบบทันที";
    }
  }

  function logout() {
    document.getElementById("dashboardBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
  }
</script>
</body>
</html>
